<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: Microsoft Fabric</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470; --line:#dde1e6;
  --accent:#0f7b6c; --accent-ink:#ffffff; --hl:#e5322d; --chip:#eef1f4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--ink:#eceff2;--muted:#9aa4af;--line:#2c3238;--accent:#2bb5a0;--accent-ink:#06201b;--hl:#ff5a54;--chip:#272d33}
}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--ink:#eceff2;--muted:#9aa4af;--line:#2c3238;--accent:#2bb5a0;--accent-ink:#06201b;--hl:#ff5a54;--chip:#272d33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shot{position:relative;line-height:0;overflow:hidden}
.shot img{width:100%;height:auto;display:block}
.hl{position:absolute;border:3px solid var(--hl);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.16);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid rgba(229,50,45,.5)}50%{outline:8px solid rgba(229,50,45,0)}}
.cursor{position:absolute;width:34px;height:34px;pointer-events:none;transform:translate(-4px,-4px);animation:tap 1.4s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@keyframes tap{0%,100%{translate:0 0}50%{translate:-5px -5px}}
.panel{position:relative;z-index:2;background:var(--card);padding:16px 18px 18px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.txt{flex:1;min-width:0}
.chip{display:inline-block;background:var(--chip);color:var(--muted);font-size:12px;padding:2px 9px;border-radius:99px;margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.txt p{margin:0;font-size:17px}
.txt b{background:var(--chip);padding:0 5px;border-radius:4px}
nav{display:flex;align-items:center;gap:12px;margin-top:12px}
nav button.nav{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 22px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;min-width:110px}
nav button.nav.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav button.nav:disabled{opacity:.4;cursor:default}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--accent);transform:scale(1.25)}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.fsbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.fsbtn:hover{color:var(--ink)}
#fsx{display:none}
.lesson{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.lesson.open{display:flex}
.lesson input{width:64px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.lesson button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:6px 14px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.lesson .lnote{color:var(--muted);font-size:12px}
body.fs .lesson{display:none}
.shotbox{display:block}
/* full-page mode: the screenshot gets all the space, caption and buttons in one slim bar */
body.fs{overflow:hidden;background:#0b0d0f}
body.fs .wrap{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column}
body.fs header,body.fs .hint,body.fs .dots{display:none}
body.fs .stage{flex:1;min-height:0;display:flex;flex-direction:column;border:0;border-radius:0;background:#0b0d0f}
body.fs .shotbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
body.fs .shot{flex:none}
body.fs .panel{padding:8px 14px;gap:12px;align-items:center;border-top:1px solid var(--line);background:var(--card)}
body.fs .num{width:30px;height:30px;font-size:14px}
body.fs .txt p{font-size:15px;line-height:1.35}
body.fs .chip{margin:0 8px 0 0;font-size:11px}
body.fs .panel nav{margin:0;gap:8px;flex:none}
body.fs nav button.nav{padding:7px 16px;min-width:0}
body.fs #fsx{display:block;position:fixed;top:8px;right:8px;z-index:5;opacity:.55;background:var(--card)}
body.fs #fsx:hover{opacity:1}
@media (max-width:600px){
  .wrap{padding:12px 16px}
  nav button.nav{padding:12px 14px;min-width:84px}
  .txt p{font-size:16px}
  .panel{padding:14px}
}
</style>
</head>
<body>
<button class="fsbtn" id="fsx"></button>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="tools">
      <button class="fsbtn" id="lsb"></button>
      <button class="fsbtn" id="fsb" title="F"></button>
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
  </header>

  <div class="lesson" id="lesson">
    <span id="lfrom"></span> <input type="number" id="lf" min="1" value="1">
    <span id="lto"></span> <input type="number" id="lt" min="1" value="1">
    <button id="lsave"></button>
    <span class="lnote" id="lnote"></span>
  </div>

  <div class="stage">
    <div class="shotbox" id="shotbox">
    <div class="shot" id="shot">
      <img id="img" alt="">
      <div class="hl" id="hl"></div>
      <svg class="cursor" id="cur" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2l15 9.5-6.5 1.6 3.7 6.9-3 1.6-3.7-6.9L4.5 19z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    </div>
    <div class="panel">
      <div class="num" id="num"></div>
      <div class="txt"><span class="chip" id="chip"></span><p id="text"></p></div>
    </div>
  </div>

  <nav>
    <button class="nav" id="prev"></button>
    <div class="dots" id="dots"></div>
    <button class="nav primary" id="next"></button>
  </nav>
  <div class="hint" id="hint"></div>
</div>

const STEPS = [{"img":"1. Workspace.png","act":"type","box":[66.9,14.36,31.7,3.64],"en":"In the <b>Create a workspace</b> panel type the workspace name in <b>Name</b>. <i>Why: the workspace holds all items of the lab in one place.</i>","ru":"В панели <b>Create a workspace</b> введите имя workspace в поле <b>Name</b>. <i>Зачем: workspace хранит все объекты лабы в одном месте.</i>"},{"img":"2. Fabric selection.png","act":"select","box":[67,50.63,32.5,11.74],"en":"Scroll down and select the workspace type <b>Fabric</b>. <i>Why: only the Fabric type gives you lakehouses, warehouses and pipelines.</i>","ru":"Прокрутите вниз и выберите тип workspace <b>Fabric</b>. <i>Зачем: только тип Fabric даёт lakehouse, warehouse и pipeline.</i>"},{"img":"2. Fabric selection.png","act":"click","box":[67,95.21,3.9,4.04],"en":"Click <b>Apply</b>. <i>This creates the workspace.</i>","ru":"Нажмите <b>Apply</b>. <i>Так создаётся workspace.</i>"},{"img":"3. Workspace crated.png","act":"click","box":[4.6,7.03,6.6,3.8],"en":"The workspace is created and empty. Click <b>+ New item</b>. <i>Why: every object of the project is created from this button.</i>","ru":"Workspace создан и пока пуст. Нажмите <b>+ New item</b>. <i>Зачем: все объекты проекта создаются с этой кнопки.</i>"},{"img":"4. Create lakehouse.png","act":"click","box":[63.9,17.37,16.5,15.72],"en":"In the search box type <b>lake</b> and click the <b>Lakehouse</b> card. <i>Why: the lakehouse will store the raw source files.</i>","ru":"В поиске введите <b>lake</b> и нажмите на карточку <b>Lakehouse</b>. <i>Зачем: lakehouse будет хранить исходные файлы как есть.</i>"},{"img":"5. Name lakehouse.png","act":"type","box":[34.5,42.84,31.3,3.68],"en":"Type the lakehouse name using the group naming style, for example <b>LH_IMSALES_SOURCES</b>. Keep <b>Lakehouse schemas</b> ticked. <i>Why: a prefix like LH_ shows the item type at a glance.</i>","ru":"Введите имя lakehouse по правилам группы, например <b>LH_IMSALES_SOURCES</b>. Галочку <b>Lakehouse schemas</b> оставьте. <i>Зачем: префикс LH_ сразу показывает тип объекта.</i>"},{"img":"5. Name lakehouse.png","act":"click","box":[57.3,60.58,4,3.77],"en":"Click <b>Create</b>. <i>This creates the lakehouse.</i>","ru":"Нажмите <b>Create</b>. <i>Так создаётся lakehouse.</i>"},{"img":"6. Lakehouse created.png","act":"click","box":[30.25,55.84,11,20.64],"en":"The lakehouse is ready. Click the card <b>Upload files</b>. <i>Why: the source CSV files must get into the lakehouse first.</i>","ru":"Lakehouse создан. Нажмите на карточку <b>Upload files</b>. <i>Зачем: сначала исходные CSV надо загрузить в lakehouse.</i>"}];

const META = {"title_en":"Demo: Microsoft Fabric, create a workspace and a lakehouse","title_ru":"Демо: Microsoft Fabric, создание рабочей области и lakehouse","sub_en":"Short real demo guide: workspace, Fabric type, lakehouse.","sub_ru":"Короткий настоящий демо-гайд: workspace, тип Fabric, lakehouse.","default_lang":"en"};
const I18N = {
  en:{title:"How to build a Pipeline in Microsoft Fabric",sub:"Step-by-step guide. Demo lesson.",prev:"Back",next:"Next",done:"Start over",hint:"Tip: arrow keys to move, F for full page.",full:"Full page",lesson:"Cut a lesson",lfrom:"Steps from",lto:"to",lsave:"Save lesson as HTML",lnote:"Saves a separate file with only these steps.",exit:"Exit full page",click:"Click",type:"Type",drag:"Drag",select:"Select",scroll:"Scroll",look:"Look",step:"Step"},
  ru:{title:"Как собрать Pipeline в Microsoft Fabric",sub:"Пошаговая инструкция. Демо-урок.",prev:"Назад",next:"Далее",done:"Сначала",hint:"Подсказка: стрелки листают, F открывает на всю страницу.",full:"На всю страницу",lesson:"Нарезать урок",lfrom:"Шаги с",lto:"по",lsave:"Сохранить урок в HTML",lnote:"Сохранится отдельный файл только с этими шагами.",exit:"Свернуть",click:"Нажать",type:"Ввести",drag:"Протянуть",select:"Выбрать",scroll:"Прокрутить",look:"Обратите внимание",step:"Шаг"}
};
for (const l of ["en","ru"]) { if (META["title_"+l]) I18N[l].title = META["title_"+l]; if (META["sub_"+l]) I18N[l].sub = META["sub_"+l]; }
let lang = (META.default_lang && I18N[META.default_lang]) ? META.default_lang : "en", i = 0;
try{ const s = localStorage.getItem("lang"); if(s && I18N[s]) lang = s; }catch(e){}
const $ = id => document.getElementById(id);

function render(){
  const t = I18N[lang], s = STEPS[i], last = i === STEPS.length - 1;
  document.documentElement.lang = lang;
  $("title").innerHTML = t.title + "<small>" + t.sub + "</small>";
  $("img").src = IMAGES[s.img];
  $("img").alt = t.step + " " + (i+1);
  const [x,y,w,h] = s.box, hl = $("hl");
  hl.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
  const c = $("cur");
  c.style.left = (x + w*0.88) + "%"; c.style.top = (y + h*0.82) + "%";
  $("num").textContent = i + 1;
  $("chip").textContent = t[s.act];
  $("text").innerHTML = s[lang];
  $("prev").textContent = t.prev; $("prev").disabled = i === 0;
  $("next").textContent = last ? t.done : t.next;
  $("hint").textContent = t.hint;
  $("dots").innerHTML = STEPS.map((_,k)=>`<button aria-label="${t.step} ${k+1}" ${k===i?'aria-current="true"':''} data-k="${k}"></button>`).join("");
  $("fsb").textContent = "⛶ " + t.full; $("fsx").textContent = "✕ " + t.exit + " (F)";
  $("lsb").textContent = "✂ " + t.lesson; $("lfrom").textContent = t.lfrom; $("lto").textContent = t.lto;
  $("lsave").textContent = t.lsave; $("lnote").textContent = t.lnote; $("lf").max = $("lt").max = STEPS.length;
  fit();
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
}
function fit(){
  const sh = $("shot"), im = $("img");
  if(!document.body.classList.contains("fs")){ sh.style.width = sh.style.height = ""; return; }
  if(!im.naturalWidth){ im.onload = fit; return; }
  const ar = im.naturalWidth / im.naturalHeight, box = $("shotbox");
  const w = Math.min(box.clientWidth, box.clientHeight * ar);
  sh.style.width = w + "px"; sh.style.height = (w / ar) + "px";
}
function toggleFS(){
  const on = document.body.classList.toggle("fs");
  const nav = document.querySelector("nav");
  if(on) document.querySelector(".panel").appendChild(nav);
  else document.querySelector(".wrap").insertBefore(nav, $("hint"));
  fit();
}
$("fsb").onclick = $("fsx").onclick = toggleFS;
window.addEventListener("resize", fit);
$("lsb").onclick = () => {
  const l = $("lesson"); l.classList.toggle("open");
  if(l.classList.contains("open")){ $("lf").value = i+1; $("lt").value = STEPS.length; }
};
$("lsave").onclick = () => {
  const a = Math.max(1, Math.min(STEPS.length, +$("lf").value || 1)), b = Math.max(a, Math.min(STEPS.length, +$("lt").value || STEPS.length));
  const steps = STEPS.slice(a-1, b), imgs = {};
  steps.forEach(s => imgs[s.img] = IMAGES[s.img]);
  const src = document.getElementById("app").textContent;
  const NL = String.fromCharCode(10);
  const k = src.indexOf(NL + "const I18N");
  const code = "const STEPS = " + JSON.stringify(steps) + ";" + NL + "const IMAGES = " + JSON.stringify(imgs) + ";" + NL + "const META = " + JSON.stringify(META) + ";" + src.slice(k);
  const doc = document.documentElement.cloneNode(true);
  doc.querySelector("body").className = "";
  doc.querySelector("#img").removeAttribute("src");
  doc.querySelector("#dots").innerHTML = "";
  doc.querySelector("#lesson").className = "lesson";
  doc.querySelector("#app").textContent = code;
  doc.querySelector("title").textContent = document.title + " (steps " + a + "-" + b + ")";
  const html = "<!doctype html>" + NL + doc.outerHTML;
  const url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
  const link = document.createElement("a");
  link.href = url; link.download = "lesson-steps-" + a + "-" + b + ".html";
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
};
function go(n){ i = Math.max(0, Math.min(STEPS.length-1, n)); render(); }
$("prev").onclick = () => go(i-1);
$("next").onclick = () => go(i === STEPS.length-1 ? 0 : i+1);
$("dots").onclick = e => { const k = e.target.dataset.k; if(k!==undefined) go(+k); };
document.querySelector(".seg").onclick = e => {
  const l = e.target.dataset.lang; if(!l) return; lang = l;
  try{ localStorage.setItem("lang", l); }catch(e){}
  render();
};
document.addEventListener("keydown", e => {
  if(e.key==="ArrowRight") go(i+1);
  if(e.key==="ArrowLeft") go(i-1);
  if((e.key==="f"||e.key==="F"||e.key==="а"||e.key==="А") && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFS();
  if(e.key==="Escape" && document.body.classList.contains("fs")) toggleFS();
});
render();
</script>
